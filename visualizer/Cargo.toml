[package]
name = "visualizer"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = "0.7.10"
nucleo-matcher = "0.3.1"
serde_json = "1.0.96"
shipyard = { path = "..", features = ["serde1"] }

# Desktop file acquisition. We match the `rfd` and `tokio` configuration `dioxus-desktop` uses.
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }
tokio = { version = "1.48", optional = true, features = ["fs", "sync", "time"] }
# Desktop auto-reload.
notify = { version = "8", optional = true }

# Browser file acquisition.
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Blob", "Event", "EventTarget", "File", "HtmlInputElement"] }

# Exactly one renderer per build: `desktop` for native Cargo commands, `web` for Wasm.
# `dx serve --platform web` swaps the default for `web` on its own.
[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:notify", "dep:rfd", "dep:tokio"]
web = [
    "dioxus/web",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
