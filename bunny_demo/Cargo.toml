[package]
name = "bunny_demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "bunny_demo"
path = "src/main.rs"

[lib]
name = "bunny_demo_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.21.0"
egui-wgpu = "0.21.0"
egui-winit = { version = "0.21.1", default-features = false }
env_logger = "0.11.11"
glam = { version = "0.34.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
log = "0.4.34"
nanorand = { version = "0.8.0", default-features = false, features = [
    "getrandom",
    "tls",
] }
pollster = "1.0.1"
# No `parallel`: the demo runs a single system and rayon has no worker threads in the browser.
shipyard = { path = "..", default-features = false, features = ["proc", "std"] }
wgpu = "0.15.1"
winit = "0.28.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
wgpu = { version = "0.15.1", features = ["webgl"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.72", features = [
    "Document",
    "Window",
    "Element",
    "Performance",
] }
